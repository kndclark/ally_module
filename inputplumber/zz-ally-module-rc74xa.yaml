# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
#
# ROG Xbox Ally X (RC74XA) for InputPlumber, installed by ally_module's
# install.sh to /usr/share/inputplumber/devices/.
#
# InputPlumber turns the Armoury Crate button's KEY_PROG1 into Steam's Quick
# Access Menu, but only for a device it matches by DMI, and its stock
# 50-rog_xbox_ally.yaml lists RC73XA and RC73YA but not RC74XA. This is that
# file with two changes: matches name RC74XA alone, so it never competes with
# the stock file on other boards, and the LED source uses ally_module's
# go_s:rgb: name instead of ally:rgb:.
#
# install.sh removes this file once a stock device file matches the board.

# Schema version number
version: 1

# The type of configuration schema
kind: CompositeDevice

# Name of the composite device mapping
name: ASUS ROG Xbox Ally

# Only allow a single source device per composite device of this type.
single_source: false

# Only use this profile if *any* of the given matches matches. If this list is
# empty, then the source devices will *always* be checked.
# /sys/class/dmi/id/product_name
matches:
  # What an X20 reports in /sys/class/dmi/id/sys_vendor.
  - dmi_data:
      board_name: RC74XA
      sys_vendor: ASUS
  # The vendor string the stock ROG entries use, should a unit report it.
  - dmi_data:
      board_name: RC74XA
      sys_vendor: ASUSTeK COMPUTER INC.

# One or more source devices to combine into a single virtual device. The events
# from these devices will be watched and translated according to the key map.
source_devices:
  - group: gamepad # Used for setting attributes on load
    hidraw:
      vendor_id: 0x0b05
      product_id: 0x1b4c
      interface_num: 2
  - group: gamepad # Used for setting attributes on load
    hidraw:
      vendor_id: 0x0b05
      product_id: 0x1b4c
      interface_num: 5
  - group: gamepad
    unique: false
    evdev:
      vendor_id: 0b05
      product_id: 1b4c
      handler: event*
  - group: imu
    iio:
      name: bmi323-imu
      mount_matrix:
        x: [1, 0, 0]
        y: [0, -1, 0]
        z: [0, 0, -1]
  - group: led
    udev:
      sys_name: go_s:rgb:joystick_rings
      subsystem: leds

# Optional configuration for the composite device
options:
  # If true, InputPlumber will automatically try to manage the input device. If
  # this is false, InputPlumber will not try to manage the device unless an
  # external service enables management of the device. Defaults to 'false'
  auto_manage: true

# The target input device(s) to emulate by default
target_devices:
  - xbox-elite
  - mouse
  - keyboard

# The ID of a device event mapping in the 'event_maps' folder
capability_map_id: aly2
